services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: perpustakaan-pnj-app
    container_name: perpustakaan-pnj-app
    restart: unless-stopped
    command: sh -lc 'php artisan storage:link --force && php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=8000'
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage/app:/opt/source/storage/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_SOCKET: ""
      DB_DATABASE: perpustakaan_pnj
      DB_USERNAME: perpustakaan_pnj
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: perpustakaan-pnj-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: perpustakaan_pnj
      MYSQL_USER: perpustakaan_pnj
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
